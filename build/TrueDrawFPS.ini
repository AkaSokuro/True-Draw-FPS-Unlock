; ------------------------------------------------------------------------
;                            True Draw FPS
; ------------------------------------------------------------------------
;
; The game updates the world 60 times per second. These options make
; motion look smooth at higher frame rates by filling in the frames
; between updates. Handling is not affected.
; Set your frame rate in the game's Display settings (Max Framerate).
;
; 1 = on, 0 = off

[TrueDrawFPS]

; Smooth camera movement.
SmoothCamera=1

; Smooth movement of cars, traffic, cops, lights and car effects.
SmoothObjects=1

; Smooth wheel spin, steering and suspension on your car.
SmoothWheels=1

; Smooth nitrous flames, smoke and sparks.
SmoothParticles=1

; Smooth menu and HUD animations.
SmoothUI=1

; ------------------------------------------------------------------------
; Responsiveness
; ------------------------------------------------------------------------

; Makes steering feel quicker by showing the game slightly ahead.
; 0 = off, 0.5 = good start, 1 = max. Higher values can make cars
; jump for a split second during crashes.
Lookahead=0

; Makes controls respond faster when your graphics card is working at
; its limit. May cost a few FPS. 1 = fastest response, 0 = game default.
FrameLatency=1

; ------------------------------------------------------------------------
; Troubleshooting
; ------------------------------------------------------------------------

; Writes TrueDrawFPS.log in this folder, a fresh one each time the game
; starts. It shows whether the mod loaded and which fixes applied.
; Turn it on if something isn't working and you want to report it.
; 1 = write the log, 0 = no log file.
Log=0