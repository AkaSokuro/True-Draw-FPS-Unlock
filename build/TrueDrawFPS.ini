[TrueDrawFPS]
; Frame rate: pick it in the game's Display settings (Max frame rate: 30 / 60 / 120 / 144 / 165 / 240 /
; UNLIMITED). Physics always runs at a fixed 60 Hz.

; Blend between 60 Hz physics steps when drawing (1 = on, 0 = off).
SmoothCamera=1
; Cars, traffic, cops, driver, traffic wheels, car-attached effects and lights
SmoothObjects=1
; Player wheel spin, steering and suspension
SmoothWheels=1
; Particles (nitrous flames, smoke, sparks) drawn at the in-between time of each frame
SmoothParticles=1
; Menu / HUD animations and the career map camera updated every drawn frame
SmoothUI=1

; Game logic that runs once per drawn frame is skipped on frames without a physics step, so it runs at most once per
; step as at 60 FPS. A precaution for very high frame rates: replay tests up to ~200 FPS showed identical physics
; with it on or off. Hex mask of 27 gates; 0 = off (pre-v0.64 behaviour).
UpdateGates=7FFFFFF

; Makes steering feel more responsive by drawing slightly ahead (0 = off, 0.5 = good start, 1 = max).
; Higher values can make cars jump briefly on crashes.
Lookahead=0
; Lowers input delay when your GPU is the bottleneck (1 = lowest delay, 0 = game default).
FrameLatency=1

; Testing: 1 = record keyboard + controller of an offline event (from the rolling start until you leave it),
; 2 = replay that recording hands off. Each run writes TrueDrawFPS.trace-<fps>-g<gates>-<rec|play>-<time>.csv;
; compare runs with tools/tracecmp.py. Start every run the same way (fresh launch, same event).
InputReplay=0

; Writes TrueDrawFPS.log next to the plugin, a fresh one each launch: whether the mod loaded, which patches applied,
; run info, and a report (address, registers, stack) if the game crashes. Turn on when troubleshooting or
; reporting a problem. 1 = write the log, 0 = no log file.
; InputReplay and Probe messages go to this log too, so set Log=1 when using them.
Log=0

; Debug: log where candidate render reads run (leave 0; needs Log=1)
Probe=0
